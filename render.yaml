services:
  # ============================================================
  # Q-TRANSIT FASTAPI BACKEND (Python Web Service)
  # ============================================================
  - type: web
    name: q-transit-backend
    runtime: python
    plan: free
    rootDir: q-transit/backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PORT
        value: 10000

  # ============================================================
  # Q-TRANSIT REACT FRONTEND (Static Site)
  # ============================================================
  - type: static
    name: q-transit-frontend
    plan: free
    rootDir: q-transit/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE
        fromService:
          type: web
          name: q-transit-backend
          property: host
